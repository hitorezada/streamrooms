services:
  - type: web
    name: streamrooms
    runtime: node
    plan: free
    # --include=dev is required because NODE_ENV=production would otherwise
    # make npm skip devDependencies (@types/*, typescript, vite) that the
    # build itself needs — the flag only affects install, not the runtime env.
    buildCommand: "cd client && npm install --include=dev && npm run build && cd ../server && npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build"
    startCommand: "cd server && npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN_DAYS
        value: "30"
      - key: STUN_URLS
        value: "stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"
